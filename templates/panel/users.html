{% extends 'base.html' %}

{% block content %}
<div class="container panel-layout">
    {% include 'panel/includes/sidebar.html' %}
    <div class="panel-content">
        <h1>Управление пользователями</h1>
        <table class="data-table">
            <thead><tr><th>Логин</th><th>ФИО</th><th>Email</th><th>Роль</th><th>Изменить роль</th></tr></thead>
            <tbody>
                {% for u in users %}
                <tr>
                    <td>{{ u.username }}</td>
                    <td>{{ u.get_full_name }}</td>
                    <td>{{ u.email }}</td>
                    <td>{{ u.role.name|default:"—" }}</td>
                    <td>
                        <form method="post" class="inline-form">
                            {% csrf_token %}
                            <input type="hidden" name="user_id" value="{{ u.pk }}">
                            <select name="role_id" class="form-control">
                                {% for role in roles %}
                                <option value="{{ role.pk }}" {% if u.role_id == role.pk %}selected{% endif %}>{{ role.name }}</option>
                                {% endfor %}
                            </select>
                            <button type="submit" class="btn btn-sm">Сохранить</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
